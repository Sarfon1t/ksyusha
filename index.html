<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090714">
  <title>A Little Gift for You 💜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="stars" aria-hidden="true"></div>
    <canvas id="particles" aria-label="A glowing particle gift transforms into a teddy bear"></canvas>

    <div class="message" id="message">
      <p class="eyebrow">A LITTLE SOMETHING FOR YOU</p>
      <h1>Made with love <span>♥</span></h1>
      <p class="hint">A little gift, just for you.</p>
    </div>

    <div class="controls">
      <button id="replay" type="button">↻ Replay</button>
      <button id="love" type="button">Send love ♥</button>
    </div>
    <p class="footer">made with a little bit of magic ✦</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
